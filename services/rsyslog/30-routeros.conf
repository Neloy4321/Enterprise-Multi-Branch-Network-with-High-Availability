# Receive RouterOS messages over UDP in this isolated EVE-NG lab.
# Restrict the service VM's firewall to the 172.16.0.0/16 lab address space.
module(load="imudp")
input(type="imudp" port="514")

template(name="RouterOSPerHost" type="string" string="/var/log/routeros/%fromhost-ip%.log")

if ($fromhost-ip startswith "172.16.") then {
    action(type="omfile" dynaFile="RouterOSPerHost" createDirs="on")
    stop
}
